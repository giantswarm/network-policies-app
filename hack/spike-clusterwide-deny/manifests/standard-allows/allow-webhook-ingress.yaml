# Kit copy of the label-selected standard allow "allow-webhook-ingress" (PRD "Standard allows (label-selected)").
# Renamed ddn-spike-label-* so that the kit never touches a real policy. Selects every endpoint of a namespace labeled
# policy.giantswarm.io/allow-webhook-ingress: "true" (cluster wide, so a CCNP; no per-namespace object, no Kyverno).
# enableDefaultDeny false/false: a policy with an ingress or egress section otherwise puts the selected endpoints into
# default deny for that direction, which would lock a labeled namespace down even without the clusterwide deny. With false
# the allow is purely additive (cilium pkg/policy/api/rule.go DefaultDenyConfig, see ../../SOURCES.md). L4 only: it does
# not cover L7 rules. Rules copied from ../generatingpolicies/generatingpolicy-allow-webhook-ingress.yaml.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ddn-spike-label-allow-webhook-ingress
  labels:
    spike.giantswarm.io/owner: default-deny-netpol
spec:
  description: "Spike: ingress from the API server (kube-apiserver + remote-node) on webhook ports."
  endpointSelector:
    matchExpressions:
      - key: io.cilium.k8s.namespace.labels.policy.giantswarm.io/allow-webhook-ingress
        operator: In
        values:
          - "true"
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "4443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            - port: "9443"
              protocol: TCP
            - port: "10250"
              protocol: TCP
