{{- if and .Values.denyByDefault.clusterWide.enabled .Values.denyByDefault.clusterWide.allowDNS.enabled }}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-dns-all-namespaces
spec:
  endpointSelector:
    {{- include "network-policies-app.clusterWide.endpointSelector" . | nindent 4 }}
  # Purely additive: must not put endpoints into default-deny mode.
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: coredns
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: k8s-dns-node-cache
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns # Used in AKS
      # L4 only, never the rules.dns block of allow-dns.yaml: an L4 DNS allow widens customer FQDN allow-lists,
      # and an L7 rule here would put the DNS of every namespace through the proxy.
      toPorts:
        - ports:
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
{{- end }}
