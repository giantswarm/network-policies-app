{{- if include "network-policies-app.konnectivityAgent.enabled" . -}}
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-kyverno-ingress-from-konnectivity
spec:
  description: "Allow the Konnectivity agent to reach the Kyverno admission controller webhook."
  endpointSelector:
    matchLabels:
      # Targets the Kyverno Admission Controller pods. This is a cluster-wide policy so that it can
      # be installed before the kyverno namespace exists, and starts matching once Kyverno is there.
      "k8s:io.kubernetes.pod.namespace": kyverno
      app.kubernetes.io/component: admission-controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            # Allows traffic from the Konnectivity Agent in kube-system (kamaji)
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: konnectivity-agent
        - matchLabels:
            # Allows traffic from the Konnectivity Agent in kube-system (AKS)
            "k8s:io.kubernetes.pod.namespace": kube-system
            app: konnectivity-agent
        - matchLabels:
            # Allows traffic from the Konnectivity Agent autoscaler in kube-system (AKS)
            "k8s:io.kubernetes.pod.namespace": kube-system
            app: konnectivity-agent-autoscaler
      toPorts:
        - ports:
            - port: "9443"
{{- end }}
