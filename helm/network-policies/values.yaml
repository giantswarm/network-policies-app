name: network-policies-app
serviceType: managed

project:
  branch: "[[ .Branch ]]"
  commit: "[[ .SHA ]]"

denyByDefault:
  enabled: true
  namespaces:
  - kube-system
  - giantswarm
  # Replaces the per-namespace default-deny-all policies with one clusterwide policy that covers every namespace.
  # Namespaces opt out with the label policy.giantswarm.io/default-deny: "false".
  clusterWide:
    enabled: false
    # Clusterwide DNS egress allow for every namespace the clusterwide deny covers. Needs clusterWide.enabled.
    allowDNS:
      enabled: false

allowEgressToDNS:
  enabled: false
  namespaces:
  - kube-system
  - giantswarm

allowEgressToProxy:
  enabled: false
  namespaces:
  - kube-system
  - giantswarm
  httpProxy: ""
  httpsProxy: ""

allowEgressToUpstreamDNS:
  enabled: false
  namespaces:
  - kube-system
  cidrs: []

azureWorkloadIdentityWebhook:
  enabled: false

hubbleRelay:
  enabled: false

# deprecated: use konnectivityAgent instead
kamaji:
  enabled: false
  namespaces:
  - kube-system

konnectivityAgent:
  enabled: false
  namespaces:
  - kube-system

denyEgressToIMDS:
  enabled: false
  cidrs:
  - 169.254.169.254/32
  # kube-system, giantswarm, karpenter and aws-load-balancer-controller are always excluded, these are added to them
  excludedNamespaces: []
  excludedNamespaceLabels: []
